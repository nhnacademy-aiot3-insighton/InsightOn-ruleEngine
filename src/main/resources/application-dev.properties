spring.application.name=insighton-ruleengine
server.port=8080
management.endpoints.web.exposure.include=health
management.zipkin.tracing.export.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:44}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
rule-engine.rabbitmq.enabled=${RULE_ENGINE_RABBITMQ_ENABLED:true}
rule-engine.sensor-event.queue=${RULE_ENGINE_SENSOR_EVENT_QUEUE:insighton.engine.sensor-events}
rule-engine.sensor-event.exchange=${RULE_ENGINE_SENSOR_EVENT_EXCHANGE:insighton.core.telemetry.exchange}
rule-engine.sensor-event.routing-key=${RULE_ENGINE_SENSOR_EVENT_ROUTING_KEY:#}
rule-engine.prototype.test-controller.enabled=${RULE_ENGINE_TEST_CONTROLLER_ENABLED:true}
eureka.client.enabled=false
spring.jpa.hibernate.ddl-auto=validate