# Dev-only settings. Common settings are in application.properties.
spring.config.import=classpath:config/dev/actuator.properties, classpath:config/dev/db.properties, classpath:config/dev/redis.properties, classpath:config/dev/rabbitmq.properties, classpath:config/dev/rule-engine.properties

spring.cloud.config.enabled=false
spring.application.name=insighton-ruleengine
server.port=8080
management.endpoints.web.exposure.include=health
management.zipkin.tracing.export.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:44}
spring.data.redis.repositories.enabled=false
rule-engine.flow-cache.type=${RULE_ENGINE_FLOW_CACHE_TYPE:redis}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
rule-engine.sensor-event.queue=${RULE_ENGINE_SENSOR_EVENT_QUEUE}
rule-engine.sensor-event.exchange=${RULE_ENGINE_SENSOR_EVENT_EXCHANGE}
rule-engine.sensor-event.routing-key=${RULE_ENGINE_SENSOR_EVENT_ROUTING_KEY}
eureka.client.enabled=false

spring.jpa.hibernate.ddl-auto=validate