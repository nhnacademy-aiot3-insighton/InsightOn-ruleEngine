rule-engine.heartbeat.enabled=${RULE_ENGINE_HEARTBEAT_ENABLED:true}
rule-engine.heartbeat.refresh-interval=5s
rule-engine.heartbeat.ttl=15s

rule-engine.schedule.zone=${RULE_ENGINE_SCHEDULE_ZONE:Asia/Seoul}
rule-engine.schedule.execution-key-ttl=${RULE_ENGINE_SCHEDULE_EXECUTION_KEY_TTL:10m}
rule-engine.schedule.pool-size=${RULE_ENGINE_SCHEDULE_POOL_SIZE:8}
rule-engine.schedule.reconciliation-interval=${RULE_ENGINE_SCHEDULE_RECONCILIATION_INTERVAL:60s}

rule-engine.flow-cache.ttl=${RULE_ENGINE_FLOW_CACHE_TTL:30m}
