rule-engine.prototype.test-controller.enabled=false
rule-engine.telemetry-routing.enabled=${TELEMETRY_ROUTING_ENABLED:true}
rule-engine.telemetry-routing.exchange=insighton.core.telemetry.exchange-v2
rule-engine.telemetry-routing.queue-prefix=${TELEMETRY_QUEUE_PREFIX}
rule-engine.telemetry-routing.owned-queue-indices=${TELEMETRY_OWNED_QUEUE_INDICES}
rule-engine.telemetry-routing.hash-header=${TELEMETRY_HASH_HEADER:locationId}
rule-engine.heartbeat.enabled=${RULE_ENGINE_HEARTBEAT_ENABLED:true}
rule-engine.heartbeat.engine-id=${RULE_ENGINE_ID}
rule-engine.heartbeat.peer-engine-id=${RULE_ENGINE_PEER_ID}
rule-engine.heartbeat.refresh-interval=5s
rule-engine.heartbeat.ttl=15s
rule-engine.group-deletion.enabled=true
rule-engine.group-deletion.exchange=insighton.core-events
rule-engine.group-deletion.routing-key=group.deleted
rule-engine.group-deletion.queue=rule-engine.group-deleted.queue
rule-engine.group-deletion.dead-letter-exchange=rule-engine.group-deleted.dlx
rule-engine.group-deletion.dead-letter-routing-key=rule-engine.group-deleted.dlq
rule-engine.group-deletion.dead-letter-queue=rule-engine.group-deleted.dlq
rule-engine.group-deletion.max-attempts=3
rule-engine.group-deletion.initial-interval=1s
rule-engine.group-deletion.multiplier=2
rule-engine.group-deletion.max-interval=10s
rule-engine.location-deletion.enabled=true
rule-engine.location-deletion.exchange=insighton.core-events
rule-engine.location-deletion.routing-key=location.deleted
rule-engine.location-deletion.queue=rule-engine.location-deleted.queue
rule-engine.location-deletion.dead-letter-exchange=rule-engine.location-deleted.dlx
rule-engine.location-deletion.dead-letter-routing-key=rule-engine.location-deleted.dlq
rule-engine.location-deletion.dead-letter-queue=rule-engine.location-deleted.dlq
rule-engine.location-deletion.max-attempts=3
rule-engine.location-deletion.initial-interval=1s
rule-engine.location-deletion.multiplier=2
rule-engine.location-deletion.max-interval=10s
