spring.datasource.url=jdbc:postgresql://${DB_HOST}:8000/aiot3-team3-project?currentSchema=engine
spring.datasource.username=aiot3-team3
spring.datasource.password=${DB_PASSWORD}
# Spring Boot uses HikariCP by default. Keep pool sizing explicit for each instance.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:50}
spring.datasource.hikari.connection-test-query=SELECT 1

