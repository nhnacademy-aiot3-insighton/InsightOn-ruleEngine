rule-engine.heartbeat.enabled=${RULE_ENGINE_HEARTBEAT_ENABLED:false}
rule-engine.heartbeat.engine-id=${RULE_ENGINE_ID:engine-a}
rule-engine.heartbeat.peer-engine-id=${RULE_ENGINE_PEER_ID:engine-b}
rule-engine.heartbeat.refresh-interval=5s
rule-engine.heartbeat.ttl=15s

rule-engine.schedule.zone=Asia/Seoul
rule-engine.schedule.execution-key-ttl=10m
rule-engine.schedule.pool-size=${RULE_ENGINE_SCHEDULE_POOL_SIZE:8}
rule-engine.schedule.reconciliation-interval=60s

rule-engine.flow-cache.ttl=${RULE_ENGINE_FLOW_CACHE_TTL:30m}
