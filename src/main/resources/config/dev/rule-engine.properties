rule-engine.prototype.test-controller.enabled=true

rule-engine.telemetry-routing.enabled=${TELEMETRY_ROUTING_ENABLED:false}
rule-engine.telemetry-routing.exchange=insighton.core.telemetry.exchange
rule-engine.telemetry-routing.queue-prefix=${TELEMETRY_QUEUE_PREFIX:insighton.ruleengine.telemetry.queue.}
rule-engine.telemetry-routing.owned-queue-indices=${TELEMETRY_OWNED_QUEUE_INDICES:}
rule-engine.telemetry-routing.hash-header=${TELEMETRY_HASH_HEADER:locationId}
rule-engine.heartbeat.enabled=${RULE_ENGINE_HEARTBEAT_ENABLED:false}
rule-engine.heartbeat.engine-id=${RULE_ENGINE_ID:engine-a}
rule-engine.heartbeat.peer-engine-id=${RULE_ENGINE_PEER_ID:engine-b}
rule-engine.heartbeat.refresh-interval=5s
rule-engine.heartbeat.ttl=15s
